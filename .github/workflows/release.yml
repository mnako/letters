---
name: Create Release from Tag
"on":
  push:
    tags:
      - v*
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --draft
          --generate-notes
          --title "Release $GITHUB_REF_NAME"
          --verify-tag
